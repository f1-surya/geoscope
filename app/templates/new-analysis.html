<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New analysis | GEOscope</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header class="page-header"><div><h1>GEOscope</h1><p>New analysis</p></div><a class="back-link" href="/">Home</a></header>
  <section class="load"><label for="accession">GEO accession</label><input id="accession" placeholder="GSE48558"><button id="load">Load</button><span id="status" role="status" aria-live="polite"></span></section>
  <nav><button data-step="dataset">Dataset</button><button data-step="samples">Samples</button><button data-step="genes">Genes</button><button data-step="analysis">Analysis</button><button data-step="results">Results</button></nav>
  <section id="dataset" class="step active"><h2>Dataset</h2><div id="dataset-info">Enter a GEO accession to begin.</div><label>Platform <select id="platform"></select></label><div id="annotation-column-controls" hidden><label>Gene assignment column <select id="annotation-column"></select></label><p>Choose the annotation column containing gene assignments for this platform.</p></div><div id="value-column-controls" hidden><label>Expression value column <select id="value-column"></select></label><p>This platform has several numeric columns; choose the expression value to analyse.</p></div><button id="platform-load">Use platform</button></section>
  <section id="samples" class="step"><h2>Samples</h2><label>Phenotype field <select id="phenotype"></select></label><div id="sample-count"></div><div id="group-counts"></div><h3>Included samples</h3><div id="sample-list"></div></section>
  <section id="genes" class="step"><h2>Genes</h2><input id="gene-search" placeholder="Search genes"><div id="gene-list"></div></section>
  <section id="analysis" class="step"><h2>Analysis</h2><p id="analysis-summary"></p><button id="run">Run analysis</button><div class="analysis-options"><label>Palette <select id="palette"></select></label><div id="color-controls"></div></div></section>
  <section id="results" class="step"><h2>Results</h2><label>Chart palette <select id="result-palette"></select></label><button id="update-chart">Update chart</button><div id="results-body"></div></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
