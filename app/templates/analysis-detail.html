<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Analysis | GEOscope</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('geoscope-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header class="page-header">
    <div class="brand">
      <div>
        <h1>GEOscope</h1>
        <p>Saved analysis</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="/">Home</a>
      <a href="/storage">Datasets</a>
      <a href="#" id="quit">Quit</a>
      <span id="quit-status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <section id="status-panel" role="status">Loading analysis...</section>

  <section id="analysis-report" hidden>
    <div id="analysis-meta"></div>
    <div class="analysis-options">
      <label>Chart palette <select id="result-palette"></select></label>
      <div id="detail-colors"></div>
      <button id="update-chart">Update chart</button>
    </div>
    <div id="results-body"></div>
  </section>
</main>
<script src="/static/header.js"></script>
<script src="/static/analysis-detail.js"></script>
</body>
</html>
