<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Datasets | GEOscope</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('geoscope-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header class="page-header">
    <div class="brand">
      <div>
        <h1>GEOscope</h1>
        <p>Datasets on disk</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="/">Home</a>
      <a href="/storage">Datasets</a>
      <a href="#" id="quit">Quit</a>
      <span id="quit-status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <section>
    <h2>Datasets on disk</h2>
    <p id="storage-total" class="storage-total">Loading datasets...</p>
    <span id="storage-status" role="status" aria-live="polite"></span>
    <div id="dataset-storage"></div>
  </section>
</main>
<script src="/static/header.js"></script>
<script src="/static/storage.js"></script>
</body>
</html>
